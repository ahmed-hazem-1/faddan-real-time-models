version: "3.9"
services:
  faddan-serving:
    build: .
    image: faddan-serving:latest
    container_name: faddan-serving
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app:ro
      - ./weights:/app/weights:ro
      - ./configs:/app/configs:ro
      - ./outputs:/app/outputs
    environment:
      - CROP=${CROP:-strawberry}
      - DEVICE=${DEVICE:-cuda}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
